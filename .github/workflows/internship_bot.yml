name: Daily Internship Scraper & Job Digest

permissions:
  contents: read

on:
  schedule:
    - cron: '30 2 * * *' # Runs daily at 02:30 UTC / 08:00 AM IST
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Hunting Bot
        env:
          # Mandatory / Primary Credentials
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

          # Optional Job Search APIs
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

          # Optional Apify Integration
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTORS: ${{ vars.APIFY_ACTORS }}
          APIFY_INPUT_JSON: ${{ vars.APIFY_INPUT_JSON }}
          APIFY_MAX_ITEMS: ${{ vars.APIFY_MAX_ITEMS }}

          # Configuration Settings
          STRICT_LOCATION: 'true'
          API_QUERIES_PER_RUN: '4'
        run: python internship_bot.py

      - name: Check Excel report presence
        id: check_excel
        if: always()
        run: |
          if [ -f internship-oct-bot.xlsx ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Excel Digest Artifact
        if: always() && steps.check_excel.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: internship-oct-bot
          path: internship-oct-bot.xlsx
          retention-days: 30
